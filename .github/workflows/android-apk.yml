name: Android APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture"
        required: false
        default: arm64

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Fix script permissions
      run: chmod +x scripts/android/*.sh

    - name: Download Android SDK
      run: bash scripts/android/download_android_sdk.sh /home/runner

    - name: Build Android app
      env:
        ANDROID_HOME: /home/runner/Android/Sdk
      run: |
        unset ANDROID_SDK_ROOT
        bash scripts/android/cmake_android.sh all DDNet org.ddnet.client Release build-android

    - name: Rename APK
      run: |
        mkdir -p artifacts
        mv build-android/DDNet.apk artifacts/DDNet.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: shalava-android
        path: artifacts/DDNet.apk
